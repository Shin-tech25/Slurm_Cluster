- name: =LDAP-ENTRY= Add a test group user04 on LDAP.
  community.general.ldap_entry:
    dn: cn=user04,ou=Group,dc=prometech,dc=co,dc=jp
    bind_dn: "{{ BIND_DN }}"
    bind_pw: "{{ slapd.root_password }}"
    server_uri: ldaps://localhost/
    state: present
    objectClass: 
      - top
      - posixGroup
      - groupofUniqueNames
    attributes:
      gidNumber: 1033
      description: Test User user04.
      cn: user04

- name: =LDAP-ENTRY= Add a test user user04 on LDAP.
  community.general.ldap_entry:
    dn: cn=user04,ou=People,dc=prometech,dc=co,dc=jp
    bind_dn: "{{ BIND_DN }}"
    bind_pw: "{{ slapd.root_password }}"
    server_uri: ldaps://localhost/
    state: present
    objectClass:
      - top
      - account
      - posixAccount
      - inetOrgPerson
      - person
      - inetUser
      - organizationalPerson
    attributes:
      uidNumber: 1033
      gidNumber: 1033
      description: Test User user04.
      uid: user04
      cn: user04
      sn: user04
      homeDirectory: /home/user04
      loginShell: /bin/bash
      userPassword: '{SSHA}QTmYdren53zFuAJ+p69NKxYkHPVeKMLL'  # This hash pw is generated at https://projects.marsching.org/weave4j/util/genpassword.php