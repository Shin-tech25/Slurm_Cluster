---
- name: Install NTP Server.
  hosts: ntpservers
  become: true
  roles:
    - role: geerlingguy.ntp
      tags: geerlingguy.ntp
      vars:
        ntp_timezone: Asia/Tokyo
        ntp_manage_config: true
        ntp_area: rhel
        ntp_cron_handler_enabled: true
        ntp_tinker_panic: true
  tasks:
    - name: Open Port
      firewalld:
        zone: public
        service: ntp
        permanent: yes
        immediate: yes
        state: enabled
    - name: chronyc makestep
      shell: |
        chronyc sources
        chronyc makestep

- name: Adjust NTP Server.
  hosts: ntpclients
  become: true
  roles:
    - role: geerlingguy.ntp
      tags: geerlingguy.ntp
      vars:
        ntp_timezone: Asia/Tokyo
        ntp_manage_config: true
        ntp_servers:
          - mnode.prometech.co.jp
        ntp_cron_handler_enabled: true
        ntp_tinker_panic: true
  tasks:
    - name: chronyc makestep
      shell: |
        chronyc sources
        chronyc makestep
